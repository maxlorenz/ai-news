name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync

      - name: Run pytest
        env:
          OPENROUTER_API_KEY: dummy_key_for_tests
          MOTHERDUCK_TOKEN: dummy_token_for_tests
          TELEGRAM_BOT_TOKEN: dummy_bot_token
          TELEGRAM_CHAT_ID: -123456789
        run: uv run pytest -v --tb=short
