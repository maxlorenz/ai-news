name: Daily AI News Scrape

on:
  schedule:
    # Runs every day at 00:00 UTC (8:00 AM Singapore time, UTC+8)
    - cron: '0 0 * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch: {}

jobs:
  run-ai-news:
    runs-on: ubuntu-latest

    env:
      # Passed into the app; configure these in repo settings → Secrets and variables → Actions
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_HTTP_REFERER: ${{ secrets.OPENROUTER_HTTP_REFERER }}
      OPENROUTER_X_TITLE: ${{ secrets.OPENROUTER_X_TITLE }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync

      - name: Run ai-news scraper
        run: uv run ai-news
